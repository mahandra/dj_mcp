<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User stream demo</title>
  <style>
    :root { color-scheme: light dark; --muted: #888; --accent: #2b7de9; --row: rgba(43, 125, 233, 0.15); }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    p.hint { color: var(--muted); margin-top: 0; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
    input, button { font: inherit; padding: 0.35rem 0.7rem; }
    button { cursor: pointer; }
    #status { color: var(--muted); margin: 0.5rem 0; min-height: 1.5em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid rgba(128, 128, 128, 0.3); }
    td.time { font-variant-numeric: tabular-nums; color: var(--muted); width: 5rem; }
    tr.new { animation: flash 0.8s ease-out; }
    @keyframes flash { from { background: var(--row); } to { background: transparent; } }
  </style>
</head>
<body>
  <h1>User stream demo</h1>
  <p class="hint">Reads <code>/api/users/stream/</code> (NDJSON) with <code>fetch</code> and adds each
    user as its line arrives. Open DevTools → Network to watch the response grow.</p>

  <form id="form">
    <input id="city" placeholder="City (optional)">
    <button id="start" type="submit">Start</button>
    <button id="stop" type="button" disabled>Stop</button>
  </form>
  <div id="status">Idle</div>

  <table>
    <thead><tr><th>Arrived</th><th>ID</th><th>Username</th><th>Name</th><th>City</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let controller = null;

    $("form").addEventListener("submit", (event) => {
      event.preventDefault();
      start($("city").value.trim());
    });
    // Aborting the fetch closes the connection; the server logs "client disconnected".
    $("stop").addEventListener("click", () => controller?.abort());

    async function start(city) {
      controller = new AbortController();
      $("rows").replaceChildren();
      $("start").disabled = true;
      $("stop").disabled = false;

      const url = new URL("/api/users/stream/", location.origin);
      if (city) url.searchParams.set("city", city);
      const started = performance.now();
      const elapsed = () => ((performance.now() - started) / 1000).toFixed(2) + "s";
      let count = 0;

      const handle = (line) => {
        if (!line) return;
        const user = JSON.parse(line); // every line is a complete JSON object
        count += 1;
        addRow(elapsed(), user);
        $("status").textContent = `Receiving… ${count} users`;
      };

      try {
        $("status").textContent = "Connecting…";
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        // Network chunks do not follow line boundaries, so keep the unfinished tail
        // in a buffer until its "\n" arrives.
        let buffer = "";
        const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
        while (true) {
          const { value, done } = await reader.read();
          console.log('value:', value)
          if (done) break;
          buffer += value;
          const lines = buffer.split("\n");
          buffer = lines.pop();
          lines.forEach(handle);
        }
        handle(buffer);
        $("status").textContent = `Done: ${count} users in ${elapsed()}`;
      } catch (error) {
        $("status").textContent = error.name === "AbortError"
          ? `Stopped after ${count} users, ${elapsed()}`
          : `Error: ${error.message}`;
      } finally {
        $("start").disabled = false;
        $("stop").disabled = true;
        controller = null;
      }
    }

    function addRow(time, user) {
      const row = document.createElement("tr");
      row.className = "new";
      const cells = [
        time, user.id, user.username,
        `${user.first_name} ${user.last_name}`.trim(), user.profile?.city ?? "",
      ];
      cells.forEach((value, index) => {
        const cell = document.createElement("td");
        cell.textContent = value; // textContent, not innerHTML: data is not trusted markup
        if (index === 0) cell.className = "time";
        row.append(cell);
      });
      $("rows").append(row);
    }
  </script>
</body>
</html>
