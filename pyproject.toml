[project]
name = "dj-mcp"
version = "0.1.0"
description = "Django REST API for users with nested profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "djangorestframework-stubs>=3.18.2",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[tool.uv]
# uv-managed CPython bundles a recent SQLite; Django 6.1 needs SQLite >= 3.37,
# which some system and pyenv builds do not provide.
python-preference = "only-managed"
